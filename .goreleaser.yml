# Ory Hydra GoReleaser Configuration
#
# Binary: hydra (single binary, entry point at root main.go)
# Docker image: distroless multi-arch image built via Dockerfile-goreleaser
# Ports: 4444 (public), 4445 (admin)

project_name: hydra

release:
  disable: true

version: 2

# Snapshot version used when running `goreleaser release --snapshot`.
# A stable name keeps local Docker tags predictable (oryd/hydra:local-<arch>).
snapshot:
  version_template: "local"

# =============================================================================
# Builds
# =============================================================================
builds:
  - id: hydra
    main: .
    binary: hydra
    flags:
      - -buildmode=exe
      - -tags=netgo
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ory/hydra/v2/driver/config.Version={{.Version}}
      - -X github.com/ory/hydra/v2/driver/config.Commit={{.Commit}}
      - -X github.com/ory/hydra/v2/driver/config.Date={{.Date}}
      - -extldflags "-static"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

# =============================================================================
# Archives
# =============================================================================
archives:
  - id: default
    formats: [binary]

# =============================================================================
# Docker images via Dockerfile-goreleaser (multi-arch, dockers_v2)
# =============================================================================
# Snapshot behavior: buildx cannot load multi-arch manifests into the local
# daemon, so `goreleaser release --snapshot` produces per-arch tags suffixed
# with -amd64 / -arm64 instead of a unified manifest. For local compose usage
# we re-tag one of them to `oryd/hydra:local` after the snapshot build.
dockers_v2:
  - id: hydra
    ids:
      - hydra
    dockerfile: .docker/Dockerfile-goreleaser
    images:
      - oryd/hydra
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: hydra
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.description: "Ory Hydra - OAuth 2.0 and OpenID Connect Server"

# =============================================================================
# Checksums
# =============================================================================
checksum:
  name_template: 'checksums.txt'
