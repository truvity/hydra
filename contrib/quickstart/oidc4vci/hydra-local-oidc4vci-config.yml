###########################################################################
#######             FOR DEMONSTRATION PURPOSES ONLY                 #######
###########################################################################
#
# Ory Hydra — OIDC4VCI Quickstart Configuration
#
# Enables all OIDC4VCI features: Pre-Authorized Code, DPoP, PAR, RAR,
# HAIP profile, Wallet Attestation, and related extensions.
#
# NOT FOR PRODUCTION USE. Secrets are hardcoded for local development.
#
###########################################################################

log:
  level: debug

dev: true

serve:
  public:
    port: 4444
    host: 0.0.0.0
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:3000
      allowed_methods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
      allowed_headers:
        - Authorization
        - Content-Type
        - DPoP
      exposed_headers:
        - Content-Type
        - DPoP-Nonce
  admin:
    port: 4445
    host: 0.0.0.0
  cookies:
    same_site_mode: Lax
    domain: ""
    secure: false
    names:
      login_csrf: ory_hydra_login_csrf
      consent_csrf: ory_hydra_consent_csrf
      session: ory_hydra_session

urls:
  self:
    issuer: http://127.0.0.1:4444
    public: http://127.0.0.1:4444
    admin: http://127.0.0.1:4445
  login: http://127.0.0.1:3000/login
  consent: http://127.0.0.1:3000/consent
  logout: http://127.0.0.1:3000/logout
  post_logout_redirect: http://127.0.0.1:3000/
  error: http://127.0.0.1:3000/error
  device:
    verification: http://127.0.0.1:3000/device/verify
    success: http://127.0.0.1:3000/device/success

secrets:
  system:
    - oidc4vci-quickstart-secret-not-for-production
  cookie:
    - oidc4vci-quickstart-cookie-not-for-production

oidc:
  subject_identifiers:
    supported_types:
      - public
      - pairwise
    pairwise:
      salt: oidc4vci-quickstart-salt-not-for-production

strategies:
  access_token: opaque
  scope: exact

oauth2:
  session:
    encrypt_at_rest: true
  hashers:
    algorithm: bcrypt
    bcrypt:
      cost: 4
  pkce:
    enforced: true
    enforced_for_public_clients: true
  expose_internal_errors: true
  exclude_not_before_claim: false
  mirror_top_level_claims: true
  allowed_top_level_claims:
    - email
    - email_verified
  client_credentials:
    default_grant_allowed_scope: false
  grant:
    refresh_token:
      rotation_grace_period: 2s
  par:
    enforced: true
    context_lifespan: 5m

# --- OIDC4VCI Feature Flags ---

# Rich Authorization Requests (RFC 9396)
rar:
  enabled: true
  types_supported:
    - openid_credential

# High Assurance Interoperability Profile
# When enforced, automatically enables: DPoP, PAR enforcement, PKCE, iss parameter
haip:
  enforced: true

# DPoP (RFC 9449)
dpop:
  enabled: true
  signing_alg_values_supported:
    - ES256
  nonce_enabled: true
  nonce_lifespan: 5m
  proof_max_age: 60s

# RFC 9207 — Authorization Server Issuer Identification
rfc9207:
  iss_parameter_enabled: true

# Pre-Authorized Code (OIDC4VCI)
preauth:
  enabled: true
  lifespan: 30m
  anonymous_access: false

# Wallet Attestation (OAuth 2.0 Attestation-Based Client Authentication)
wallet_attestation:
  enabled: true
  trust_anchors:
    # Root CA of the HAIP conformance attester. Generated by
    # test/oidc4vci-external/gen-attester-jwks.sh and baked into
    # attester-keys/ca.cert.pem. The leaf cert that actually signs attestations
    # is delivered per-request in the JWT x5c header.
    - |
      -----BEGIN CERTIFICATE-----
      MIIBpDCCAUmgAwIBAgIUeH8+5vWHevX1inuktUthepW0bHAwCgYIKoZIzj0EAwIw
      JzElMCMGA1UEAwwcaGFpcC13YWxsZXQtYXR0ZXN0ZXItcm9vdC1jYTAeFw0yNjA0
      MjMxNDI4MTFaFw0zNjA0MjAxNDI4MTFaMCcxJTAjBgNVBAMMHGhhaXAtd2FsbGV0
      LWF0dGVzdGVyLXJvb3QtY2EwWTATBgcqhkjOPQIBBggqhkjOPQMBBwNCAATEkBP2
      TQfEdzytAQGoJG6MO0kqerZvIC/CWTl+A4UzmkwP5r/1RIaZ4kZggc1n/ec1Tf+p
      EFoc60Cx04688wjuo1MwUTAdBgNVHQ4EFgQUZsMn3mDXyVm5GnL/6IrnWysPeqkw
      HwYDVR0jBBgwFoAUZsMn3mDXyVm5GnL/6IrnWysPeqkwDwYDVR0TAQH/BAUwAwEB
      /zAKBggqhkjOPQQDAgNJADBGAiEApDyyo0OabOl/EC5jJkWwBHcEKElXYbnJ8hjT
      1Sig+IECIQDr2F01ijVRGU1Pm2NYmlJC+R2+DAwOj0YtZLOLUsxwgQ==
      -----END CERTIFICATE-----

# --- TTLs ---

ttl:
  login_consent_request: 30m
  access_token: 5m
  refresh_token: 720h
  id_token: 1h
  auth_code: 10m
  authentication_session: 720h
